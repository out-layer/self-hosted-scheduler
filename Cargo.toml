[package]
name = "outlayer-scheduler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Generic config-driven scheduler for OutLayer agents"

[[bin]]
name = "outlayer-scheduler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
